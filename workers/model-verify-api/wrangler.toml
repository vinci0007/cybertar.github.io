name = "cybertar-model-verify-api"
main = "src/index.js"
compatibility_date = "2026-06-05"
compatibility_flags = ["nodejs_compat"]

[placement]
mode = "smart"

[observability]
enabled = true
head_sampling_rate = 1

[vars]
MODEL_VERIFY_TABLE = "model_verify_reports"
MODEL_VERIFY_SESSION_TABLE = "model_verify_sessions"
MODEL_VERIFY_DISCUSSION_TABLE = "model_verify_discussions"
CORS_ALLOW_ORIGINS = "https://cybertar.youngood.tech,https://cybertar.github.io,http://localhost:4177,http://localhost:4178"
MAX_REPORT_BYTES = "120000"
GITHUB_SITE_OWNER = "vinci0007"
GITHUB_SITE_OWNER_ID = "39933794"
MODEL_VERIFY_SITE_URL = "https://cybertar.youngood.tech/lab/model-verifier/"
MODEL_VERIFY_PROXY_ALLOWED_HOSTS = "*"
MODEL_VERIFY_EDGE_CACHE_TTL_SECONDS = "3600"
MODEL_VERIFY_STALE_CACHE_TTL_SECONDS = "21600"
MODEL_VERIFY_SESSION_USER_CACHE_TTL_SECONDS = "300"
MODEL_VERIFY_SKIP_READ_SCHEMA_ENSURE = "true"

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "380fd0a06c23477dac339d358e8c7f86"

# Recommended for Cockroach Cloud:
# 1. Create a Hyperdrive config:
#    npx wrangler hyperdrive create cybertar-model-verify-db --connection-string="postgresql://..."
# 2. Uncomment and set the generated id.
#
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "replace-with-hyperdrive-id"
#
# Quick fallback without Hyperdrive:
# npx wrangler secret put DATABASE_URL

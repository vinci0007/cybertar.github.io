<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogs | CyberTAR</title>
    <link rel="icon" type="image/jpeg" href="../images/Cybertar.png">
    <link rel="stylesheet" href="../styles.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;500&display=swap"
        rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
    <style>
        body {
            background: #050505 !important;
        }

        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        .noise-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            opacity: 0.05;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .glass-panel {
            background: rgba(10, 15, 30, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .back-button {
            position: fixed;
            top: 30px;
            left: 30px;
            padding: 12px 24px;
            border-radius: 30px;
            color: #fff;
            text-decoration: none;
            font-weight: 300;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            z-index: 100;
            text-transform: uppercase;
            font-size: 12px;
        }

        .back-button:hover {
            border-color: #fff;
            text-shadow: 0 0 10px #fff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .blog-shell {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            padding: 8rem 1.5rem 5rem;
        }

        .blog-hero {
            max-width: 1080px;
            margin: 0 auto 3rem;
            display: grid;
            grid-template-columns: minmax(0, 1.2fr) minmax(280px, 0.8fr);
            gap: 3rem;
            align-items: center;
        }

        .blog-kicker {
            font-family: var(--font-display);
            color: rgba(255, 255, 255, 0.62);
            letter-spacing: 0.28rem;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        .blog-title {
            font-family: var(--font-display);
            font-size: clamp(2.4rem, 8vw, 5.6rem);
            line-height: 0.95;
            margin-bottom: 1.4rem;
            color: #fff;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.18);
        }

        .blog-copy {
            color: var(--text-secondary);
            line-height: 1.9;
            max-width: 680px;
        }

        .blog-orbit {
            aspect-ratio: 1;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.18);
            display: grid;
            place-items: center;
            position: relative;
            background:
                radial-gradient(circle at 50% 45%, rgba(255, 255, 255, 0.16), transparent 34%),
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.06), transparent 64%);
            box-shadow: inset 0 0 50px rgba(255, 255, 255, 0.06), 0 0 80px rgba(255, 255, 255, 0.08);
        }

        .blog-orbit::before,
        .blog-orbit::after {
            content: '';
            position: absolute;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 50%;
        }

        .blog-orbit::before {
            inset: 18%;
        }

        .blog-orbit::after {
            width: 72%;
            height: 34%;
            transform: rotate(-18deg);
        }

        .blog-orbit strong {
            font-family: var(--font-display);
            font-size: 3rem;
            letter-spacing: 0.1rem;
            color: #fff;
        }

        .blog-grid {
            max-width: 1080px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 1rem;
        }

        .blog-card {
            min-height: 210px;
            padding: 1.5rem;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .blog-card span {
            color: rgba(255, 255, 255, 0.5);
            font-family: var(--font-display);
            font-size: 0.78rem;
            letter-spacing: 0.14rem;
            text-transform: uppercase;
        }

        .blog-card h2 {
            color: #fff;
            font-size: 1.2rem;
            margin: 1.2rem 0 0.8rem;
        }

        .blog-card p {
            color: var(--text-secondary);
            line-height: 1.7;
            font-size: 0.95rem;
        }

        @media (max-width: 860px) {
            .blog-hero,
            .blog-grid {
                grid-template-columns: 1fr;
            }

            .blog-orbit {
                max-width: 320px;
                margin: 0 auto;
            }
        }
    </style>
</head>

<body>
    <div class="noise-overlay"></div>
    <div id="canvas-container"></div>
    <a href="../index.html" class="back-button glass-panel">← 返回首页</a>

    <main class="blog-shell">
        <section class="blog-hero">
            <div>
                <p class="blog-kicker">CyberTAR Logs</p>
                <h1 class="blog-title">Blogs</h1>
                <p class="blog-copy">
                    这里会沉淀项目观察、AI 工具实验、开源趋势笔记与一些正在成形的想法。页面现在先补齐站点风格与入口，后续可以直接在这里挂载文章列表。
                </p>
            </div>
            <div class="blog-orbit" aria-hidden="true">
                <strong>LOG</strong>
            </div>
        </section>

        <section class="blog-grid" aria-label="Blog sections">
            <article class="blog-card">
                <div>
                    <span>Research</span>
                    <h2>AI 观察</h2>
                    <p>记录模型能力、工具链变化与值得复盘的实验现象。</p>
                </div>
            </article>
            <article class="blog-card">
                <div>
                    <span>Build</span>
                    <h2>项目手记</h2>
                    <p>整理网站功能、自动化流程和自研工具的迭代脉络。</p>
                </div>
            </article>
            <article class="blog-card">
                <div>
                    <span>Signal</span>
                    <h2>趋势摘录</h2>
                    <p>筛选开源、论文、产品与创作者生态里的高信号内容。</p>
                </div>
            </article>
        </section>
    </main>

    <script src="../script.js?v=2026061406"></script>
</body>

</html>
